name: Leaderboard
# A player posts a round by opening a pre-filled issue from the game ("[score] NAME +3 (75) Course"). This workflow validates the
# JSON in the issue body (treated purely as data, never run as code), adds it to leaderboard/<course>.json and closes the issue.
# A daily challenge result ("[daily] ...") goes to leaderboard/daily-<day>.json instead. The player's compact stats profile is kept in
# leaderboard/players.json (by device hash) so a name on a board can be opened.
on:
  issues:
    types: [opened]
  schedule:
    - cron: '20 5 * * *' # just after the daily challenge closes (midnight US Eastern): the day's points are counted
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: leaderboard
  cancel-in-progress: false
jobs:
  overall:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          node -e "const z=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());require('./.github/scripts/daily-overall.js')(z)"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add leaderboard
          git diff --cached --quiet || { git commit -m 'Daily overall standings'; for i in 1 2 3 4; do git push origin HEAD:main && break || git pull --rebase origin main; done; }
  record:
    if: github.event_name == 'issues' && (startsWith(github.event.issue.title, '[score]') || startsWith(github.event.issue.title, '[daily]') || startsWith(github.event.issue.title, '[rename]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const issue = context.payload.issue;
            const finish = async (ok, msg) => {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: (ok ? '✅ ' : '❌ ') + msg });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: ok ? 'completed' : 'not_planned' });
            };
            const m = /```json\s*([\s\S]*?)```/.exec(issue.body || '');
            let r; try { r = JSON.parse(m[1]); } catch (e) { return finish(false, 'No valid score JSON found in this issue.'); }
            if (issue.title.startsWith('[rename]')) {
              // a name change: every score ever posted from this device (the device id, not the name, is the player) takes the new name
              if (!r || typeof r.name !== 'string' || !/^[\p{L}\p{N} ._'-]{1,14}$/u.test(r.name.trim())) return finish(false, 'Invalid name.');
              const nn = r.name.trim(), who = crypto.createHash('sha1').update(String(typeof r.dev === 'string' && r.dev.length >= 6 && r.dev.length <= 40 ? r.dev : issue.user.login).toLowerCase()).digest('hex').slice(0, 8);
              const rd = (f, d) => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch (e) { return d; } };
              const changed = [], olds = new Set();
              for (const f of fs.readdirSync('leaderboard').filter(f => /^(gccb|alsace|augusta|rothley|stpatricks|daily-\d{4}-\d{2}-\d{2})\.json$/.test(f))) {
                const rows = rd('leaderboard/' + f, null); if (!Array.isArray(rows)) continue; let hit = false;
                for (const x of rows) if (x && x.by === who && x.name !== nn) { olds.add(x.name); x.name = nn; hit = true; }
                if (hit) { fs.writeFileSync('leaderboard/' + f, JSON.stringify(rows) + '\n'); changed.push('leaderboard/' + f); }
              }
              // the profile keeps the names used in the past (newest first), so a profile can show them
              const pf0 = rd('leaderboard/players.json', {}), prof = pf0[who];
              if (prof && prof.n && prof.n !== nn) olds.add(prof.n);
              const prev = [...olds, ...((prof && prof.on) || [])].filter((x, i, a) => typeof x === 'string' && x.toLowerCase() !== nn.toLowerCase() && a.findIndex(y => y.toLowerCase() === x.toLowerCase()) === i).slice(0, 10);
              if (prof ? (prof.n !== nn || JSON.stringify(prof.on || []) !== JSON.stringify(prev)) : prev.length) {
                pf0[who] = Object.assign({}, prof || { at: Date.now() }, { n: nn }, prev.length ? { on: prev } : {}); fs.writeFileSync('leaderboard/players.json', JSON.stringify(pf0) + '\n'); changed.push('leaderboard/players.json');
              }
              if (!changed.length) return finish(true, 'No scores from this device to rename.');
              try { const z = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); changed.push(...require(process.env.GITHUB_WORKSPACE + '/.github/scripts/daily-overall.js')(z)); } catch (e) { core.warning('overall: ' + e.message); }
              await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']); await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
              await exec.exec('git', ['add', ...changed]); await exec.exec('git', ['commit', '-m', `Leaderboard: a player is now ${nn}`]);
              for (let k = 0; k < 4; k++) { try { await exec.exec('git', ['push', 'origin', 'HEAD:main']); break; } catch (e) { await exec.exec('git', ['pull', '--rebase', 'origin', 'main']); } }
              return finish(true, `Renamed: your scores are now listed as ${nn}.`);
            }
            const COURSES = { gccb: 72, alsace: 72, augusta: 72, rothley: 71, stpatricks: 71 };
            const int = v => Number.isInteger(v);
            const isDaily = issue.title.startsWith('[daily]');
            if (!r || typeof r !== 'object' || !(r.course in COURSES)) return finish(false, 'Unknown course.');
            if (typeof r.name !== 'string' || !/^[\p{L}\p{N} ._'-]{1,14}$/u.test(r.name.trim())) return finish(false, 'Invalid name.');
            if (r.holes !== 18 && !isDaily) return finish(false, 'The score does not add up.');
            if (!int(r.strokes) || r.strokes < 18 || r.strokes > 200 || !int(r.toPar) || r.toPar !== r.strokes - COURSES[r.course]) return finish(false, 'The score does not add up.');
            if (!int(r.at) || r.at > Date.now() + 10 * 60e3 || r.at < Date.now() - 3 * 864e5) return finish(false, 'The round is too old (or from the future).');
            const name = r.name.trim(), by = crypto.createHash('sha1').update(String(typeof r.dev === 'string' && r.dev.length >= 6 && r.dev.length <= 40 ? r.dev : issue.user.login).toLowerCase()).digest('hex').slice(0, 8);
            // the compact stats profile and the best shots of the round: numbers only, from a fixed list of keys
            const PF = ['xp', 'r', 'h', 'st', 'pu', 'ac', 'ea', 'bi', 'pa', 'bo', 'dd', 'fh', 'ft', 'gh', 'gt', 'sh', 'di', 'wa', 'ob', 'tr', 'rb', 'ch', 'dr', 'ho', 'pt', 'br', 'gs', 'fs', 'bk'];
            const BS = ['h', 'n', 'c', 'k', 'l', 'f', 'd', 'e', 't', 'o', 'b', 'q', 'sm', 's', 'fw', 'lp', 'p'];
            const num = v => typeof v === 'number' && Number.isFinite(v) && Math.abs(v) < 1e8;
            const pick = (o, keys) => { const out = {}; if (o && typeof o === 'object') for (const k of keys) if (num(o[k])) out[k] = Math.round(o[k] * 100) / 100; return out; };
            // a best shot also carries its clip: the 18 numbers that let the game fly it again
            const pickShot = x => { const o = pick(x, BS); if (x && Array.isArray(x.cl) && x.cl.length === 18 && x.cl.every(num)) o.cl = x.cl.map(v => Math.round(v * 1e4) / 1e4); return o; };
            const pf = pick(r.pf, PF); if (r.pf && Array.isArray(r.pf.tw)) pf.tw = r.pf.tw.filter(num).slice(-40); const bs = Array.isArray(r.bs) ? r.bs.slice(0, 3).map(pickShot).filter(x => Object.keys(x).length >= 8) : [];
            // the scorecard: strokes and putts per hole, kept only when they are whole numbers that add up
            const ints = (a, lo, hi) => Array.isArray(a) && a.length === 18 && a.every(v => int(v) && v >= lo && v <= hi);
            const putts = ints(r.pt, 0, 9) ? r.pt : null;
            const save = async (files, msg) => {
              await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']); await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
              await exec.exec('git', ['add', ...files]); await exec.exec('git', ['commit', '-m', msg]);
              for (let k = 0; k < 4; k++) { try { await exec.exec('git', ['push', 'origin', 'HEAD:main']); break; } catch (e) { await exec.exec('git', ['pull', '--rebase', 'origin', 'main']); } }
            };
            const readJson = (f, d) => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch (e) { return d; } };
            const profiles = () => {
              if (!Object.keys(pf).length && !bs.length) return null;
              const f = 'leaderboard/players.json', all = readJson(f, {}), old = all[by];
              // bs: the player's best shots over the career (top three by points); rb: the best shots of the last two rounds
              const key = x => x.cl ? x.cl.slice(7, 9).join(',') + x.cl[1] + x.cl[10] : [x.h, x.n, x.p].join('-'), seen = new Set(), career = [];
              for (const x of [...bs, ...((old && old.bs) || [])].sort((a, b) => (b.p || 0) - (a.p || 0))) { if (seen.has(key(x))) continue; seen.add(key(x)); career.push(x); }
              const rb = (bs.length ? [{ at: r.at, bs }] : []).concat((old && old.rb) || []).slice(0, 2);
              const on = ((old && old.on) || []).filter(x => x.toLowerCase() !== name.toLowerCase()); if (old && old.n && old.n.toLowerCase() !== name.toLowerCase() && !on.some(x => x.toLowerCase() === old.n.toLowerCase())) on.unshift(old.n); // other usernames used in the past
              all[by] = Object.assign({ n: name, pf, bs: career.slice(0, 3), rb, at: r.at }, on.length ? { on: on.slice(0, 10) } : {});
              const keys = Object.keys(all).sort((a, b) => all[b].at - all[a].at).slice(0, 300), out = {}; for (const k of keys) out[k] = all[k];
              fs.writeFileSync(f, JSON.stringify(out) + '\n'); return f;
            };
            if (isDaily) {
              // the daily challenge: one chance per player and day, on the course of the day, finished within that day (US Eastern time)
              const zday = ms => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms));
              const day = r.daily;
              if (typeof day !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(day) || zday(r.at) !== day) return finish(false, 'The round was not finished on the day of the challenge.');
              const dn = Math.floor(Date.UTC(+day.slice(0, 4), +day.slice(5, 7) - 1, +day.slice(8, 10)) / 864e5);
              const cod = dn >= 20746 ? ['stpatricks', 'gccb', 'alsace', 'augusta', 'rothley'][(dn - 20746) % 5] : dn >= 20745 ? ['rothley', 'gccb', 'alsace', 'augusta'][(dn - 20745) % 4] : ['gccb', 'alsace', 'augusta'][dn % 3]; // Rothley Park joins the turn on 2026-10-19, St Patrick's on 2026-10-20
              if (cod !== r.course) return finish(false, 'That is not the course of the day.');
              if (!Array.isArray(r.h) || r.h.length !== 18 || !r.h.every(v => int(v) && v >= 1 && v <= 16) || r.h.reduce((a, b) => a + b, 0) !== r.strokes) return finish(false, 'The hole scores do not add up.');
              const file = `leaderboard/daily-${day}.json`; let rows = readJson(file, []);
              if (rows.some(x => x.by === by || x.name.toLowerCase() === name.toLowerCase())) return finish(true, 'There is already a result for this player on this daily challenge: one chance only.');
              if (rows.length >= 500) return finish(false, 'The board is full.');
              rows.push(Object.assign({ name, strokes: r.strokes, toPar: r.toPar, h: r.h, at: r.at, by, c: r.course }, putts ? { pt: putts } : {}));
              rows.sort((a, b) => a.toPar - b.toPar || a.at - b.at);
              fs.writeFileSync(file, JSON.stringify(rows) + '\n');
              const files = [file], pfile = profiles(); if (pfile) files.push(pfile);
              try { files.push(...require(process.env.GITHUB_WORKSPACE + '/.github/scripts/daily-overall.js')(zday(Date.now()))); } catch (e) { core.warning('overall: ' + e.message); }
              await save(files, `Daily ${day}: ${name} ${r.toPar >= 0 ? '+' : ''}${r.toPar}`);
              return finish(true, `Posted. You are #${rows.findIndex(x => x.by === by) + 1} of ${rows.length} on the daily challenge of ${day}.`);
            }
            const file = `leaderboard/${r.course}.json`; let rows = readJson(file, []);
            if (rows.some(x => x.name === name && x.at === r.at)) return finish(true, 'This round is already on the board.');
            // one player, one entry per course: their best score. A player is a name (any case) or a device id; a round that doesn't beat it is not listed.
            const sameP = x => x.name.toLowerCase() === name.toLowerCase() || x.by === by, better = (p, q) => p.toPar < q.toPar || (p.toPar === q.toPar && p.strokes < q.strokes);
            const old = rows.filter(sameP), best = old.reduce((m, x) => !m || better(x, m) ? x : m, null);
            if (best && !better(r, best)) return finish(true, `Your best on the ${r.course} board stays ${best.toPar >= 0 ? '+' : ''}${best.toPar} (${best.strokes}): this round didn't beat it.`);
            if (rows.filter(x => x.by === by && x.at > Date.now() - 864e5).length >= 6) return finish(false, 'Too many rounds posted today from this device.');
            if (rows.filter(x => x.at > Date.now() - 36e5).length >= 120) return finish(false, 'The board is busy; try again later.');
            const holes = ints(r.h, 1, 16) && r.h.reduce((a, b) => a + b, 0) === r.strokes ? r.h : null;
            rows = rows.filter(x => !sameP(x));
            rows.push(Object.assign({ name, strokes: r.strokes, toPar: r.toPar, holes: 18, at: r.at, by }, holes ? { h: holes } : {}, holes && putts ? { pt: putts } : {}));
            rows.sort((a, b) => a.toPar - b.toPar || a.strokes - b.strokes || a.at - b.at); rows = rows.slice(0, 500);
            fs.writeFileSync(file, JSON.stringify(rows) + '\n');
            const rank = rows.findIndex(x => x.name === name && x.at === r.at) + 1;
            const files = [file], pfile = profiles(); if (pfile) files.push(pfile);
            await save(files, `Leaderboard: ${name} ${r.toPar >= 0 ? '+' : ''}${r.toPar} on ${r.course}`);
            await finish(true, `Posted. You are #${rank} of ${rows.length} on the ${r.course} board.`);
