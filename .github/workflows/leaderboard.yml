name: Leaderboard
# A player posts a round by opening a pre-filled issue from the game ("[score] NAME +3 (75) Course"). This workflow validates the
# JSON in the issue body (treated purely as data, never run as code), adds it to leaderboard/<course>.json and closes the issue.
# A daily challenge result ("[daily] ...") goes to leaderboard/daily-<day>.json instead. The player's compact stats profile is kept in
# leaderboard/players.json (by device hash) so a name on a board can be opened.
on:
  issues:
    types: [opened]
  schedule:
    - cron: '10 4 * * *' # just after the daily challenge closes (midnight US Eastern is 04:00 UTC in summer time, 05:00 UTC in winter): the day's points are counted
    - cron: '10 5 * * *'
    - cron: '40 5 * * *' # a late safety run
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: leaderboard
  cancel-in-progress: false
jobs:
  overall:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          node -e "const z=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());require('./.github/scripts/daily-overall.js')(z)"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add leaderboard
          git diff --cached --quiet || { git commit -m 'Daily overall standings'; for i in 1 2 3 4; do git push origin HEAD:main && break || git pull --rebase origin main; done; }
  record:
    if: github.event_name == 'issues' && (startsWith(github.event.issue.title, '[score]') || startsWith(github.event.issue.title, '[daily]') || startsWith(github.event.issue.title, '[rename]') || startsWith(github.event.issue.title, '[reply]') || startsWith(github.event.issue.title, '[home]') || startsWith(github.event.issue.title, '[feature]') || startsWith(github.event.issue.title, '[vote]') || startsWith(github.event.issue.title, '[standings]') || startsWith(github.event.issue.title, '[merge]') || startsWith(github.event.issue.title, '[sync]') || startsWith(github.event.issue.title, '[device]') || startsWith(github.event.issue.title, '[devmsg]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const issue = context.payload.issue;
            const finish = async (ok, msg) => {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: (ok ? '✅ ' : '❌ ') + msg });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: ok ? 'completed' : 'not_planned' });
            };
            // a repeated vote or an unchanged file leaves nothing staged: skip the commit (it would fail the run) and the push
            const gitCommit = async msg => { if ((await exec.exec('git', ['diff', '--cached', '--quiet'], { ignoreReturnCode: true })) !== 0) await exec.exec('git', ['commit', '-m', msg]); };
            const m = /```json\s*([\s\S]*?)```/.exec(issue.body || '');
            let r; try { r = JSON.parse(m[1]); } catch (e) { return finish(false, 'No valid score JSON found in this issue.'); }
            // ---- helpers shared by the name change and the account merge
            const sha8 = d => crypto.createHash('sha1').update(String(typeof d === 'string' && d.length >= 6 && d.length <= 40 ? d : issue.user.login).toLowerCase()).digest('hex').slice(0, 8);
            const rdj = (f, d) => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch (e) { return d; } };
            const NAMEOK = /^[\p{L}\p{N} ._'-]{1,14}$/u;
            const gitPush = async (files, msg) => {
              await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']); await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
              await exec.exec('git', ['add', ...files]); await gitCommit(msg);
              for (let k = 0; k < 4; k++) { try { await exec.exec('git', ['push', 'origin', 'HEAD:main']); break; } catch (e) { await exec.exec('git', ['pull', '--rebase', 'origin', 'main']); } }
            };
            // every score ever posted from these devices (the device id, not the name, is the player) and their profiles take the name; returns the files changed
            const setNames = (devs, nn) => {
              const changed = [], olds = new Set();
              for (const f of fs.readdirSync('leaderboard').filter(f => /^(gccb|alsace|augusta|rothley|stpatricks|pebblebeach|mountainvalley|fourmile|westminster|landmand|isles|daily-\d{4}-\d{2}-\d{2})\.json$/.test(f))) {
                const rows = rdj('leaderboard/' + f, null); if (!Array.isArray(rows)) continue; let hit = false;
                for (const x of rows) if (x && devs.includes(x.by) && x.name !== nn) { olds.add(x.name); x.name = nn; hit = true; }
                if (hit) { fs.writeFileSync('leaderboard/' + f, JSON.stringify(rows) + '\n'); changed.push('leaderboard/' + f); }
              }
              // the profile keeps the names used in the past (newest first), so a profile can show them
              const pf0 = rdj('leaderboard/players.json', {}); let pch = false;
              for (const d of devs) {
                const prof = pf0[d];
                if (prof && prof.n && prof.n !== nn) olds.add(prof.n);
                const prev = [...olds, ...((prof && prof.on) || [])].filter((x, i, a) => typeof x === 'string' && x.toLowerCase() !== nn.toLowerCase() && a.findIndex(y => y.toLowerCase() === x.toLowerCase()) === i).slice(0, 10);
                if (prof ? (prof.n !== nn || JSON.stringify(prof.on || []) !== JSON.stringify(prev)) : prev.length) { pf0[d] = Object.assign({}, prof || { at: Date.now() }, { n: nn }, prev.length ? { on: prev } : {}); pch = true; }
              }
              if (pch) { fs.writeFileSync('leaderboard/players.json', JSON.stringify(pf0) + '\n'); changed.push('leaderboard/players.json'); }
              return changed;
            };
            // the other devices of a merged account: p (the first partner) and ps (all of them, when an account has more than two devices)
            const mgPeers = (mg, id) => { const e = mg && mg.g && mg.g[id]; return e ? [...new Set([e.p, ...(Array.isArray(e.ps) ? e.ps : [])])].filter(x => typeof x === 'string' && x !== id) : []; };
            if (issue.title.startsWith('[merge]') || issue.title.startsWith('[sync]')) {
              // Two devices, one account. leaderboard/merges.json: { q: [{ f, t, n, at }] (open requests: device f asks device t), g: { device: { p: partner, ps: [all partners, if more than one], n: name, nat: when the name last changed, at: merged } }, x: { name: { u } } (merged accounts opened for one more device until u) }.
              // A request is made by the new device, the merge happens only when the device that is asked accepts it; it cannot be undone.
              // A merged pair (or a pair about to merge) also files its own stats here ([sync]) so each device can add the other's to its own.
              const who = sha8(r.dev), HX = /^[0-9a-f]{8}$/, mf = 'leaderboard/merges.json';
              const mg = rdj(mf, {}); mg.q = Array.isArray(mg.q) ? mg.q : []; mg.g = mg.g && typeof mg.g === 'object' ? mg.g : {};
              if (issue.title.startsWith('[sync]')) {
                if (!mg.g[who] && !mg.q.some(x => x.f === who || x.t === who)) return finish(false, 'This device is not merging.');
                const PF = ['xp', 'r', 'h', 'st', 'pu', 'ac', 'ea', 'bi', 'pa', 'bo', 'dd', 'fh', 'ft', 'gh', 'gt', 'sh', 'di', 'wa', 'ob', 'tr', 'rb', 'ch', 'fd', 'lo', 'dr', 'ho', 'pt', 'br', 'gs', 'fs', 'bk'];
                const num = v => typeof v === 'number' && Number.isFinite(v) && Math.abs(v) < 1e8;
                const pf = {}; if (r.pf && typeof r.pf === 'object') for (const k of PF) if (num(r.pf[k])) pf[k] = Math.round(r.pf[k] * 100) / 100;
                if (!Object.keys(pf).length) return finish(false, 'No stats.');
                const f = 'leaderboard/players.json', all = rdj(f, {}), old = all[who] || {}, files = [f];
                const af = 'leaderboard/acct/' + who + '.json', exJs = r.ex && typeof r.ex === 'object' && !Array.isArray(r.ex) ? JSON.stringify(r.ex) : null;
                if (JSON.stringify(old.pf || {}) === JSON.stringify(pf) && (exJs === null || exJs.length > 90000 || (fs.existsSync(af) && fs.readFileSync(af, 'utf8').trim() === exJs))) return finish(true, 'Nothing new to save.');
                all[who] = Object.assign({}, old, { n: old.n || (typeof r.name === 'string' && NAMEOK.test(r.name.trim()) ? r.name.trim() : 'Player'), pf, at: Date.now() });
                fs.writeFileSync(f, JSON.stringify(all) + '\n');
                // the rest of the account (scorecard history, trophies, shot clips, daily results ...): kept as is, for the other device to read; the game checks every entry again
                if (r.ex && typeof r.ex === 'object' && !Array.isArray(r.ex)) { const js = JSON.stringify(r.ex); if (js.length <= 90000) { fs.mkdirSync('leaderboard/acct', { recursive: true }); fs.writeFileSync('leaderboard/acct/' + who + '.json', js + '\n'); files.push('leaderboard/acct/' + who + '.json'); } }
                await gitPush(files, 'Stats synced for a merged account'); return finish(true, 'Stats saved.');
              }
              const act = r && r.act, now = Date.now(), files = [mf];
              if (act === 'ask') {
                const to = r.to, nm = typeof r.name === 'string' ? r.name.trim() : '';
                if (!NAMEOK.test(nm) || typeof to !== 'string' || !HX.test(to) || to === who) return finish(false, 'Invalid request.');
                // a merged account the developer has opened for one more device (mg.x: { name: { u: open until } }): the device joins at once, nobody has to accept it
                const ox = mg.x && mg.g[to] && !mg.g[who] && String(mg.g[to].n).toLowerCase() === nm.toLowerCase() ? mg.x[nm.toLowerCase()] : null;
                if (ox && ox.u > now) {
                  const mem = [to, ...mgPeers(mg, to)], all = [...mem, who], n0 = mg.g[to].n;
                  for (const id of mem) mg.g[id] = Object.assign({}, mg.g[id] || {}, { p: (mg.g[id] && mg.g[id].p) || to, ps: all.filter(x => x !== id) });
                  mg.g[who] = { p: to, ps: all.filter(x => x !== who), n: n0, nat: mg.g[to].nat || now, at: now };
                  delete mg.x[nm.toLowerCase()]; mg.q = mg.q.filter(x => x.f !== who && x.t !== who);
                  fs.writeFileSync(mf, JSON.stringify(mg) + '\n');
                  files.push(...setNames(all, n0));
                  try { const z = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); files.push(...require(process.env.GITHUB_WORKSPACE + '/.github/scripts/daily-overall.js')(z)); } catch (err) { core.warning('overall: ' + err.message); }
                  await gitPush(files, `Accounts merged: ${n0} (device ${all.length})`); return finish(true, 'This device has joined the account.');
                }
                if (mg.g[who] || mg.g[to]) return finish(false, 'One of the accounts is already merged.');
                const pl = rdj('leaderboard/players.json', {});
                let known = !!pl[to]; if (!known) for (const f of fs.readdirSync('leaderboard').filter(f => /^(gccb|alsace|augusta|rothley|stpatricks|pebblebeach|mountainvalley|fourmile|westminster|landmand|isles)\.json$/.test(f))) if ((rdj('leaderboard/' + f, []) || []).some(x => x && x.by === to)) { known = true; break; }
                if (!known) return finish(false, 'No such player.');
                if (pl[to] && pl[to].n && pl[to].n.toLowerCase() !== nm.toLowerCase()) return finish(false, 'The names do not match.');
                mg.q = mg.q.filter(x => x.f !== who).concat({ f: who, t: to, n: (pl[to] && pl[to].n) || nm, at: now }).slice(-300);
                fs.writeFileSync(mf, JSON.stringify(mg) + '\n'); await gitPush(files, 'Merge asked'); return finish(true, 'Request filed. It has to be accepted on the other device.');
              }
              const from = r.from;
              if (typeof from !== 'string' || !HX.test(from)) return finish(false, 'Invalid request.');
              // the request was sent to one device of the name; any device that carries the same name can answer it (the other device may have another id)
              const nmA = typeof r.name === 'string' ? r.name.trim().toLowerCase() : '';
              const e = mg.q.find(x => x.f === from && x.t === who) || (nmA && from !== who ? mg.q.find(x => x.f === from && String(x.n).toLowerCase() === nmA) : null);
              if (act === 'decline') {
                if (!e) return finish(true, 'Nothing to decline.');
                mg.q = mg.q.filter(x => x !== e); fs.writeFileSync(mf, JSON.stringify(mg) + '\n'); await gitPush(files, 'Merge declined'); return finish(true, 'Declined.');
              }
              if (act !== 'accept') return finish(false, 'Unknown action.');
              if (!e) return finish(false, 'There is no such request.');
              if (mg.g[who] || mg.g[from]) return finish(false, 'One of the accounts is already merged.');
              mg.g[who] = { p: from, n: e.n, nat: now, at: now }; mg.g[from] = { p: who, n: e.n, nat: now, at: now };
              mg.q = mg.q.filter(x => ![who, from].includes(x.f) && ![who, from].includes(x.t));
              fs.writeFileSync(mf, JSON.stringify(mg) + '\n');
              files.push(...setNames([who, from], e.n));
              try { const z = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); files.push(...require(process.env.GITHUB_WORKSPACE + '/.github/scripts/daily-overall.js')(z)); } catch (err) { core.warning('overall: ' + err.message); }
              await gitPush(files, `Accounts merged: ${e.n}`); return finish(true, 'The two devices are now one account.');
            }
            if (issue.title.startsWith('[standings]')) {
              // a game that sees a closed day missing from the archive and the standings asks for them to be rebuilt (the scheduled run can be hours late, or skipped)
              const zs = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
              let sf = []; try { sf = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/daily-overall.js')(zs); } catch (e) { return finish(false, 'The standings could not be rebuilt: ' + e.message); }
              const dirty = (await exec.getExecOutput('git', ['status', '--porcelain', ...sf])).stdout.trim();
              if (!dirty) return finish(true, 'The archive and the standings are up to date.');
              await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']); await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
              await exec.exec('git', ['add', ...sf]); await gitCommit('Daily archive and standings rebuilt');
              for (let k = 0; k < 4; k++) { try { await exec.exec('git', ['push', 'origin', 'HEAD:main']); break; } catch (e) { await exec.exec('git', ['pull', '--rebase', 'origin', 'main']); } }
              return finish(true, 'The archive and the standings were rebuilt.');
            }
            if (issue.title.startsWith('[device]')) {
              // a computer: the scores this device posted before rounds were tagged move to the computer boards (the daily boards stay one)
              if (!r || r.pc !== 1) return finish(false, 'Invalid device type.');
              const who = sha8(r.dev), changed = [];
              for (const f of fs.readdirSync('leaderboard').filter(f => /^(gccb|alsace|augusta|rothley|stpatricks|pebblebeach|mountainvalley|fourmile|westminster|landmand|isles)\.json$/.test(f))) {
                const rows = rdj('leaderboard/' + f, null); if (!Array.isArray(rows)) continue; let hit = false;
                for (const x of rows) if (x && x.by === who && !x.pc) { x.pc = 1; hit = true; }
                if (hit) { fs.writeFileSync('leaderboard/' + f, JSON.stringify(rows) + '\n'); changed.push('leaderboard/' + f); }
              }
              // and the device is noted as a computer for good: the daily challenge is closed to it
              { const pf = 'leaderboard/pcdev.json'; let a = []; try { a = JSON.parse(fs.readFileSync(pf, 'utf8')); } catch (e) { } if (!Array.isArray(a)) a = [];
                if (!a.includes(who)) { a.push(who); fs.writeFileSync(pf, JSON.stringify(a) + '\n'); changed.push(pf); } }
              if (!changed.length) return finish(true, 'No scores from this device to move.');
              await gitPush(changed, 'Leaderboard: a computer\'s scores move to the computer boards');
              return finish(true, 'Your scores are now on the computer boards.');
            }
            if (issue.title.startsWith('[devmsg]')) {
              // a message to the developer (menu, Feature requests, Message): kept in leaderboard/messages.json, shown in the inbox of the player called Florian
              const who = sha8(r && r.dev), t = r && typeof r.t === 'string' ? r.t.trim() : '';
              if (!t || t.length > 1000) return finish(false, 'Empty or too long.');
              const f = 'leaderboard/messages.json'; let a = rdj(f, []); if (!Array.isArray(a)) a = [];
              if (a.filter(x => x.by === who && Date.now() - x.at < 864e5).length >= 5) return finish(false, 'Enough messages for today. Try again tomorrow.');
              a.push({ id: Date.now().toString(36) + who.slice(0, 3), by: who, name: typeof r.name === 'string' && NAMEOK.test(r.name.trim()) ? r.name.trim() : 'Player', t, at: Date.now() });
              fs.writeFileSync(f, JSON.stringify(a.slice(-300)) + '\n');
              await gitPush([f], 'A message to the developer');
              return finish(true, 'Thanks, your message has been delivered.');
            }
            if (issue.title.startsWith('[reply]')) {
              // a player's reply to a note from the developer (only the player the note went to can answer it): kept in leaderboard/replies.json, the developer's devices show it once
              const FROM = { zain1: ['753ff0b4', '6c3f623c'] }, who = sha8(r && r.dev);
              if (!r || typeof r.id !== 'string' || !FROM[r.id] || !FROM[r.id].includes(who)) return finish(false, 'Unknown note.');
              if (typeof r.t !== 'string' || !r.t.trim() || r.t.length > 1000) return finish(false, 'Empty or too long.');
              const f = 'leaderboard/replies.json'; let a = rdj(f, []); if (!Array.isArray(a)) a = [];
              if (a.filter(x => x.id === r.id && x.by === who).length >= 5) return finish(false, 'Enough replies to this note.');
              a.push({ id: r.id, by: who, name: typeof r.name === 'string' && NAMEOK.test(r.name.trim()) ? r.name.trim() : 'Player', t: r.t.trim(), at: Date.now() });
              fs.writeFileSync(f, JSON.stringify(a.slice(-200)) + '\n');
              await gitPush([f], 'A reply to a note from the developer');
              return finish(true, 'Thanks, your reply has been delivered.');
            }
            if (issue.title.startsWith('[rename]')) {
              // a name change: every score ever posted from this device (and from the device it is merged with) takes the new name
              if (!r || typeof r.name !== 'string' || !NAMEOK.test(r.name.trim())) return finish(false, 'Invalid name.');
              const nn = r.name.trim(), who = sha8(r.dev), mg = rdj('leaderboard/merges.json', {}), prs = mgPeers(mg, who).filter(x => mg.g[x]);
              const changed = setNames([who, ...prs], nn);
              if (prs.length) { const t = Date.now(); for (const id of [who, ...prs]) { mg.g[id].n = nn; mg.g[id].nat = t; } fs.writeFileSync('leaderboard/merges.json', JSON.stringify(mg) + '\n'); changed.push('leaderboard/merges.json'); } // (the other device picks the new name up at its next launch)
              if (!changed.length) return finish(true, 'No scores from this device to rename.');
              try { const z = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); changed.push(...require(process.env.GITHUB_WORKSPACE + '/.github/scripts/daily-overall.js')(z)); } catch (e) { core.warning('overall: ' + e.message); }
              await gitPush(changed, `Leaderboard: a player is now ${nn}`);
              return finish(true, `Renamed: your scores are now listed as ${nn}.`);
            }
            if (issue.title.startsWith('[home]')) {
              // a player's home course (asked after ten rounds, editable in the menu): kept by device hash in leaderboard/homecourses.json, newest answer wins
              const OK = /^[\p{L}\p{N} .,'&()\/-]+$/u, cl = (v, n) => typeof v === 'string' ? v.replace(/\s+/g, ' ').trim() : '';
              const hc = cl(r && r.course), hr = cl(r && r.region);
              if (!hc || hc.length < 2 || hc.length > 40 || !OK.test(hc) || !hr || hr.length < 2 || hr.length > 30 || !OK.test(hr)) return finish(false, 'Invalid home course.');
              const who = crypto.createHash('sha1').update(String(typeof r.dev === 'string' && r.dev.length >= 6 && r.dev.length <= 40 ? r.dev : issue.user.login).toLowerCase()).digest('hex').slice(0, 8);
              let hf = {}; try { hf = JSON.parse(fs.readFileSync('leaderboard/homecourses.json', 'utf8')); } catch (e) { }
              const nm = typeof r.name === 'string' && /^[\p{L}\p{N} ._'-]{1,14}$/u.test(r.name.trim()) ? r.name.trim() : '';
              hf[who] = { c: hc, r: hr, n: nm, at: Date.now() };
              fs.writeFileSync('leaderboard/homecourses.json', JSON.stringify(hf) + '\n');
              await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']); await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
              await exec.exec('git', ['add', 'leaderboard/homecourses.json']); await gitCommit('Home course noted');
              for (let k = 0; k < 4; k++) { try { await exec.exec('git', ['push', 'origin', 'HEAD:main']); break; } catch (e) { await exec.exec('git', ['pull', '--rebase', 'origin', 'main']); } }
              return finish(true, 'Thanks! Your home course is noted.');
            }
            if (issue.title.startsWith('[feature]') || issue.title.startsWith('[vote]')) {
              // feature requests (leaderboard/features.json): [{ id, t, d, n, by, at, s: 'open'|'done', done, v: { deviceHash: 1|-1 } }]; a request's id is its issue number.
              // Only the maintainers mark one done (they edit the file); a vote can be changed or taken back (v: 0).
              const who = crypto.createHash('sha1').update(String(typeof r.dev === 'string' && r.dev.length >= 6 && r.dev.length <= 40 ? r.dev : issue.user.login).toLowerCase()).digest('hex').slice(0, 8);
              let ff = []; try { ff = JSON.parse(fs.readFileSync('leaderboard/features.json', 'utf8')); } catch (e) { }
              const cl = (v, n) => typeof v === 'string' ? v.replace(/\p{C}/gu, ' ').replace(/\s+/g, ' ').trim().slice(0, n) : '';
              let msg;
              if (issue.title.startsWith('[feature]')) {
                const t = cl(r.title, 60), d = cl(r.text, 300);
                if (t.length < 4) return finish(false, 'The request needs a title.');
                const day = Date.now() - 864e5;
                if (ff.filter(x => x.by === who && x.at > day).length >= 3) return finish(false, 'Three requests a day is the limit.');
                if (ff.some(x => x.s === 'open' && x.t.toLowerCase() === t.toLowerCase())) return finish(false, 'This request is already on the list.');
                const nm = typeof r.name === 'string' && /^[\p{L}\p{N} ._'-]{1,14}$/u.test(r.name.trim()) ? r.name.trim() : '';
                ff.push({ id: issue.number, t, d, n: nm, by: who, at: Date.now(), s: 'open', v: { [who]: 1 } });
                msg = 'Thanks! Your request is on the list.';
              } else {
                const f = ff.find(x => x.id === r.id);
                if (!f || f.s !== 'open' || ![1, -1, 0].includes(r.vote)) return finish(false, 'Unknown request.');
                f.v = f.v || {}; if (r.vote) f.v[who] = r.vote; else delete f.v[who];
                msg = 'Vote counted.';
              }
